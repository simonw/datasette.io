[project]
name = "datasette-io"
version = "0"
description = "The official project website for Datasette"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4",
    "click",
    "datasette==1.0a40",
    "datasette-atom==0.10a0",
    "datasette-cluster-map",
    "datasette-debug-asgi",
    "datasette-graphql==3.0a1",
    "datasette-ip-rate-limit==0.1a0",
    "datasette-json-html",
    "datasette-publish-fly>=1.4",
    "datasette-referrer-policy==0.1",
    "datasette-render-markdown>=2.2.1",
    "datasette-template-sql",
    "datasette-turnstile==0.1a3",
    "datasette-vega",
    "dogsheep-beta>=0.11",
    "feedparser",
    "github-to-sqlite>=2.9.1",
    "html5lib",
    "httpx",
    "markdown",
    "markdown-to-sqlite>=1.0",
    "pygments",
    "pypi-to-sqlite>=0.2.3",
    "python-dateutil",
    "python-graphql-client",
    "pyyaml",
    "s3-credentials",
    "sqlite-utils>=3.9.1",
    "yaml-to-sqlite>=1.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false
